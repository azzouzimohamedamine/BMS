# Ageing datasets (Kaggle downloads) used for SOH / RUL. Place the CSV files in data/raw/KAGGLE/.
# Every statement below was checked in docs/AGING_DATA_AUDIT.md (generated by scripts/run_aging_experiments.py).
raw_dir: data/raw/KAGGLE
eol_fraction: 0.70          # EOL = first cycle with capacity <= 0.70 * FIRST-cycle capacity (rule verified to reproduce the files' own battery_life)
min_history_cycles: 5       # RUL is evaluated only from this cycle on (needs a short capacity history)
quality_rules:
  min_cycles: 15
  max_capacity_over_first: 1.15   # a capacity > 115 % of the first cycle signals a corrupted trajectory
leak_columns: [RUL, NRUL, battery_life, capacity_norm, capacity_diff, capacity_ma5]   # answers or capacity-derived (unknown normalisation)
redundant_columns: [arrhenius_fade_rate]    # exact function of temp_mean (R^2 = 1.0000 in log(rate) vs 1/T)
datasets:
  - id: NASA_FEATURES
    file: features_arrhenius_tempmean.csv
    provenance: EXPERIMENTAL_DERIVED
    description: "Battery IDs follow NASA PCoE naming (B0005...). Per-cycle features computed by an unknown third party; provenance NOT verified."
  - id: NASA_AUGMENTED
    file: augmented_full_dataset.csv
    provenance: AUGMENTED
    description: "Identical original rows of NASA_FEATURES (7 batteries) + 3 artificial replicas per battery (is_augmented=True). Replicas are used ONLY as extra training rows of the training batteries, never for testing."
  - id: PYBAMM
    file: pybamm_synthetic_features.csv
    provenance: SIMULATED
    description: "PyBaMM simulation, 6 virtual batteries. Results are NOT experimental evidence."
